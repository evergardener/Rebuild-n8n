name: Fix n8n and build docker

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: '拉取标签，格式: owner/repo@tag，例如: n8n-io/n8n@2.1.1'
        required: false
        default: ''

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          # 可选参数，保留某些工具，默认会删除大量预装软件
          tool-cache: true    # 删除 GitHub 的 tool cache（约 10GB）
          android: true       # 删除 Android SDK（约 12GB）
          dotnet: true        # 删除 .NET SDK（约 10GB）
          haskell: true       # 删除 Haskell 平台（约 2GB）
          large-packages: true # 删除一些大包（如 mysql, azure-cli 等）
          docker-images: true  # 删除所有预装的 Docker 镜像（约 2GB）
          swap-storage: true   # 清理 swap 文件

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 获取最新 n8n 版本
        id: latest-version
        run: |
          pip install requests packaging
          python scripts/get_latest_n8n_release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN }}

      - name: 输出最新版本
        run: |
          echo "最新 n8n 版本: ${{ steps.latest-version.outputs.LATEST_TAG }}"

      - name: 解析仓库和标签
        id: parse-ref
        if: inputs.ref != ''
        run: |
          REFS="${{ inputs.ref }}"
          
          if [[ "$REFS" == *"@"* ]]; then
            REPO_PART=$(echo "$REFS" | cut -d'@' -f1)
            TAG="${{ inputs.ref }}"  # 完整标签，包括前缀
            
            if [[ "$REPO_PART" == *"/"* ]]; then
              REPO="$REPO_PART"
            else
              REPO="n8n-io/$REPO_PART"
            fi
            
            echo "repository=$REPO" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "解析结果: 仓库=$REPO, 标签=$TAG"
          else
            echo "格式错误，请使用 仓库名@标签 格式"
            exit 1
          fi

      - name: 拉取目标仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ref != '' && steps.parse-ref.outputs.repository || 'n8n-io/n8n' }}
          ref: ${{ inputs.ref != '' && steps.parse-ref.outputs.tag || steps.latest-version.outputs.LATEST_TAG }}
          fetch-depth: 1

      - name: 拉取locales和patches
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: source-repo
          sparse-checkout: |
            locales
            patches
          sparse-checkout-cone-mode: false

      - name: 复制locales文件
        run: |
          mkdir -p packages/frontend/@n8n/i18n/src/locales
          cp -r source-repo/locales/* packages/frontend/@n8n/i18n/src/locales/

      - name: 应用patch
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(source-repo/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "::error::source-repo/patches 下没有 .patch 文件"
            exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "Applying: $patch"
            if ! git apply --verbose "$patch"; then
              echo "::error::Patch 应用失败: $patch"
              cat "$patch"
              exit 1
            fi
          done

      - name: 解析上游基础镜像
        id: base-images
        # 基础镜像由上游 docker/docker-bake.hcl 提供，Dockerfile 里没有默认值：不传
        # build-arg 时 buildx 报 "base name (${BUILDER_IMAGE}) should not be blank"。
        # 这里不假设 build-arg 对应哪个变量，而是读 target "n8n" / "runners" 的 args
        # 块，把每个 build-arg 解析成它的取值（字面量或变量默认值）。上游换对应关系时
        # 本步骤直接失败，而不是推出一个用错基础镜像的镜像：n8n 3.4.1 把 n8n 的
        # BUILDER_IMAGE 从 BUILDER_IMAGE 改成 N8N_BUILDER_IMAGE，用错会从 stock node
        # 复制来一个缺 libatomic、V8 也没有 -n8n.N 后缀的 node（Dockerfile 第 67 行
        # 的校验会以 exit 127 失败）。
        run: |
          python3 - <<'PY'
          import os, re, sys

          BAKE_FILE = 'docker/docker-bake.hcl'

          # target -> 本 workflow 要传给该镜像的 build-arg
          WANTED = {
              'n8n': ['BUILDER_IMAGE', 'RUNTIME_IMAGE', 'ENABLE_POINTER_COMPRESSION'],
              'runners': ['NODE_IMAGE', 'PYTHON_IMAGE', 'ALPINE_IMAGE'],
          }
          # 允许缺失的 build-arg -> 缺失时的取值（同 Dockerfile 里 ARG 的默认值）
          OPTIONAL = {'ENABLE_POINTER_COMPRESSION': 'false'}

          try:
              with open(BAKE_FILE, encoding='utf-8') as handle:
                  hcl = handle.read()
          except OSError:
              sys.exit(f'找不到 {BAKE_FILE}：无法从上游 bake 文件读取基础镜像')

          def fail(message):
              sys.exit(f'{BAKE_FILE}: {message}')

          def braced(text, start):
              """返回 start（'{' 之后）到配对 '}' 之前的文本。"""
              depth = 1
              pos = start
              while pos < len(text) and depth:
                  if text[pos] == '{':
                      depth += 1
                  elif text[pos] == '}':
                      depth -= 1
                  pos += 1
              if depth:
                  fail('大括号不配对')
              return text[start:pos - 1]

          def target_block(name):
              match = re.search(r'^target\s+"%s"\s*\{' % re.escape(name), hcl, re.M)
              if not match:
                  fail(f'没有 target "{name}" 块')
              return braced(hcl, match.end())

          def target_args(name):
              body = target_block(name)
              match = re.search(r'\bargs\s*=\s*\{', body)
              if not match:
                  fail(f'target "{name}" 没有 args 块')
              args = {}
              for line in braced(body, match.end()).splitlines():
                  line = line.split('#', 1)[0].strip().rstrip(',')
                  if not line or '=' not in line:
                      continue
                  key, _, value = line.partition('=')
                  args[key.strip()] = value.strip()
              return args

          def variable_default(name):
              match = re.search(r'^variable\s+"%s"\s*\{\s*default\s*=\s*"([^"]*)"' % re.escape(name), hcl, re.M)
              if not match:
                  fail(f'变量 {name} 没有字符串默认值')
              return match.group(1)

          resolved = {}
          for target, wanted in WANTED.items():
              args = target_args(target)
              for arg in wanted:
                  key = f'{target}_{arg.lower()}'
                  raw = args.get(arg)
                  if raw is None:
                      if arg in OPTIONAL:
                          resolved[key] = OPTIONAL[arg]
                          continue
                      fail(f'target "{target}" 的 args 里没有 {arg}')
                  literal = re.fullmatch(r'"([^"]*)"', raw)
                  if literal:
                      value = literal.group(1)
                  elif re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', raw):
                      value = variable_default(raw)
                  else:
                      fail(f'target "{target}" 的 {arg} = {raw} 不是字符串字面量或变量名')
                  if not value:
                      fail(f'target "{target}" 的 {arg} 解析为空')
                  resolved[key] = value

          for key, value in resolved.items():
              print(f'{key}={value}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in resolved.items():
                  output.write(f'{key}={value}\n')
          PY

      - name: 读取package.json
        id: package
        run: |
          NODE_VERSION=$(grep -o '"node": "[^"]*"' package.json | cut -d'"' -f4 | sed 's/>=//')
          PNPM_VERSION=$(grep -o '"pnpm": "[^"]*"' package.json | cut -d'"' -f4 | sed 's/>=//')
          IMAGE_TAG=$(grep -o '"version": "[^"]*"' package.json | cut -d'"' -f4)
          echo "node_version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "pnpm_version=$PNPM_VERSION" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Node version: $NODE_VERSION"
          echo "Pnpm version: $PNPM_VERSION"
          echo "Image tag: $IMAGE_TAG"

      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.package.outputs.node_version }}

      - name: 安装pnpm
        uses: pnpm/action-setup@v4

      - name: 设置Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: 获取小写用户名
        id: lowercase
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER_LOWER" >> $GITHUB_OUTPUT

      - name: 登录GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      
      - name: 检查n8n镜像是否已存在
        id: check-n8n-exists
        run: |
          if docker manifest inspect ghcr.io/${{ steps.lowercase.outputs.owner }}/n8n:${{ steps.package.outputs.image_tag }} > /dev/null 2>&1; then
            echo "n8n镜像已存在，跳过构建"
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "n8n镜像不存在，需要构建"
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: 检查runners镜像是否已存在
        id: check-runners-exists
        run: |
          if docker manifest inspect ghcr.io/${{ steps.lowercase.outputs.owner }}/runners:${{ steps.package.outputs.image_tag }} > /dev/null 2>&1; then
            echo "runners镜像已存在，跳过构建"
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "runners镜像不存在，需要构建"
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 安装依赖
        if: steps.check-n8n-exists.outputs.skip_build != 'true' || steps.check-runners-exists.outputs.skip_build != 'true'
        run: |
          rm -rf node_modules packages/*/node_modules
          pnpm install --frozen-lockfile

      - name: 验证依赖
        if: steps.check-n8n-exists.outputs.skip_build != 'true' || steps.check-runners-exists.outputs.skip_build != 'true'
        run: |
          ls -la node_modules/zx/ 2>/dev/null && echo "zx 已安装" || echo "zx 未安装"

      - name: 预编译
        if: steps.check-n8n-exists.outputs.skip_build != 'true' || steps.check-runners-exists.outputs.skip_build != 'true'
        run: |
          NODE_OPTIONS="--max-old-space-size=4096" TSC_SKIP_LIB_CHECK=true node scripts/build-n8n.mjs

      - name: 修复Dockerfile中/usr/local/bin路径
        if: steps.check-n8n-exists.outputs.skip_build != 'true'
        run: |
          sed -i 's|/usr/local/bin/n8n|/usr/bin/n8n|g' docker/images/n8n/Dockerfile

      - name: 构建并推送n8n镜像
        if: steps.check-n8n-exists.outputs.skip_build != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/images/n8n/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILDER_IMAGE=${{ steps.base-images.outputs.n8n_builder_image }}
            RUNTIME_IMAGE=${{ steps.base-images.outputs.n8n_runtime_image }}
            ENABLE_POINTER_COMPRESSION=${{ steps.base-images.outputs.n8n_enable_pointer_compression }}
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/n8n:${{ steps.package.outputs.image_tag }}
            ghcr.io/${{ steps.lowercase.outputs.owner }}/n8n:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送runners镜像
        if: steps.check-runners-exists.outputs.skip_build != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/images/runners/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_IMAGE=${{ steps.base-images.outputs.runners_node_image }}
            PYTHON_IMAGE=${{ steps.base-images.outputs.runners_python_image }}
            ALPINE_IMAGE=${{ steps.base-images.outputs.runners_alpine_image }}
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/runners:${{ steps.package.outputs.image_tag }}
            ghcr.io/${{ steps.lowercase.outputs.owner }}/runners:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 结束
        run: |
          echo "成功构建并推送n8n和runners镜像。"
